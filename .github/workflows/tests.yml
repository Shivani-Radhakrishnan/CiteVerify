name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (network fully mocked)
        run: python -m pytest -q
      - name: Reproduce the benchmark results offline
        run: python -m evaluation.run --split test --no-save
      - name: Reproduce the language-model citation results offline
        run: python -m evaluation.run_llm --no-save
